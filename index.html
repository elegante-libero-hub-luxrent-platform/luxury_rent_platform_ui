        const EmptyState = ({ title }) => (

        const EndpointCard = ({ endpoint, baseUrl }) => {
            const [loading, setLoading] = useState(false);
            const [result, setResult] = useState(null);
            const [error, setError] = useState(null);
            const [inputs, setInputs] = useState({});

            // Initialize inputs
            useEffect(() => {
                const initialInputs = {};
                endpoint.params.forEach(p => initialInputs[p.name] = p.value || "");
                setInputs(initialInputs);
            }, [endpoint]);

            const handleInputChange = (name, val) => {
                setInputs(prev => ({ ...prev, [name]: val }));
            };

            const executeCall = async () => {
                setLoading(true);
                setResult(null);
                setError(null);

                let finalPath = endpoint.path;
                let body = null;
                
                const headers = {};
                if (endpoint.method === 'POST' || endpoint.method === 'PUT' || endpoint.method === 'PATCH') {
                    headers['Content-Type'] = 'application/json';
                }
                
                let constructedUrl = `${baseUrl}${finalPath}`;

                endpoint.params.forEach(param => {
                    if (param.name === 'body') {
                        try {
                            if(inputs['body']) body = inputs['body']; 
                        } catch(e) {
                            setError("Invalid JSON in body");
                            return;
                        }
                    } else if (endpoint.path.includes(`{${param.name}}`)) {
                        // Replace {id} in the string
                        constructedUrl = constructedUrl.replace(`{${param.name}}`, inputs[param.name]);
                    }
                });

                if (error) { setLoading(false); return; }

                const urlObj = new URL(constructedUrl);
                endpoint.params.forEach(param => {
                    if (param.name !== 'body' && !endpoint.path.includes(`{${param.name}}`)) {
                        // It's a query param
                        if (inputs[param.name]) {
                            urlObj.searchParams.append(param.name, inputs[param.name]);
                        }
                    }
                });

                try {
                    const res = await fetch(urlObj.toString(), {
                        method: endpoint.method,
                        headers: headers,
                        body: (endpoint.method === 'POST' || endpoint.method === 'PUT' || endpoint.method === 'PATCH') ? body : undefined
                    });

                    if (res.status === 204) {
                        setResult({ success: true, message: "204 No Content (Deleted successfully)" });
                    } else if (res.status === 202) {
                        const location = res.headers.get("Location");
                        const data = await res.json().catch(() => ({})); // try parse json, fallback empty
                        setResult({ 
                            status: "202 Accepted", 
                            locationHeader: location,
                            ...data
                        });
                    } else {
                        const data = await res.json();
                        if (!res.ok) {
                            throw new Error(JSON.stringify(data) || `Error ${res.status}`);
                        }
                        setResult(data);
                    }
                    
                } catch (err) {
                    console.error(err);
                    setError(err.message || "Network Error (CORS?)");
                } finally {
                    setLoading(false);
                }
            };

            // Color coding methods
            const methodColors = {
                GET: "bg-blue-100 text-blue-700",
                POST: "bg-green-100 text-green-700",
                PUT: "bg-orange-100 text-orange-700",
                DELETE: "bg-red-100 text-red-700",
                PATCH: "bg-purple-100 text-purple-700"
            };

            return (
                <div className="bg-white rounded-3xl p-6 shadow-xl border-b-8 border-slate-100 card-float flex flex-col h-full">
                    <div className="flex items-center gap-3 mb-4">
                        <span className={`px-3 py-1 rounded-lg font-black text-sm ${methodColors[endpoint.method]}`}>
                            {endpoint.method}
                        </span>
                        <span className="font-mono text-slate-600 font-bold text-lg truncate" title={endpoint.path}>
                            {endpoint.path}
                        </span>
                    </div>

                    <p className="text-slate-500 mb-6 text-sm font-medium flex-grow">{endpoint.description}</p>
                    {endpoint.params.length > 0 && (
                        <div className="bg-slate-50 p-4 rounded-xl mb-4 border-2 border-slate-100">
                            {endpoint.params.map(param => (
                                <div key={param.name} className="mb-3 last:mb-0">
                                    <label className="block text-xs font-bold text-slate-400 uppercase mb-1">
                                        {param.name}
                                    </label>
                                    {param.type === 'json' ? (
                                        <textarea 
                                            className="w-full p-2 rounded-lg border-2 border-slate-200 focus:border-blue-300 focus:outline-none font-mono text-sm h-32"
                                            placeholder={param.placeholder}
                                            value={inputs[param.name] || ''}
                                            onChange={(e) => handleInputChange(param.name, e.target.value)}
                                        />
                                    ) : (
                                        <input 
                                            type={param.type === 'date' ? 'date' : 'text'}
                                            className="w-full p-2 rounded-lg border-2 border-slate-200 focus:border-blue-300 focus:outline-none font-bold text-slate-700"
                                            placeholder={param.placeholder}
                                            value={inputs[param.name] || ''}
                                            onChange={(e) => handleInputChange(param.name, e.target.value)}
                                        />
                                    )}
                                </div>
                            ))}
                        </div>
                    )}

                    <button 
                        onClick={executeCall}
                        disabled={loading}
                        className={`
                            w-full py-3 rounded-xl font-bold text-white mb-4 btn-3d mt-auto
                            ${loading ? 'bg-slate-300 cursor-not-allowed' : 'bg-blue-400 hover:bg-blue-500'}
                        `}
                    >
                        {loading ? <i className="ph ph-spinner animate-spin text-xl"></i> : "Call Endpoint"}
                    </button>

                    {/* Results Area */}
                    {(result || error) && (
                        <div className={`p-4 rounded-xl border-2 text-sm overflow-x-auto ${error ? 'bg-red-50 border-red-100 text-red-600' : 'bg-green-50 border-green-100 text-slate-700'}`}>

                                    </div>
                                    <span className="break-all">{error}</span>
                                </div>
                            ) : (

                            )}
                        </div>
                    )}
                </div>
            );
        };

            );
        };

        const OrderPage = () => {
            return (
                <div className="w-full">
                    <div className="bg-green-50 border-4 border-green-100 rounded-[2rem] p-8 mb-8 text-center">
                        <div className="inline-block p-4 bg-white rounded-full shadow-lg mb-4">
                             <i className="ph ph-shopping-cart text-4xl text-green-500"></i>
                        </div>
                        <h2 className="text-3xl font-black text-slate-800 mb-2">Order & Rental</h2>
                        <p className="text-slate-500 font-medium">Manage orders, workflows, jobs, and history logs.</p>
                        <div className="mt-4 inline-block bg-white px-4 py-1 rounded-full text-xs font-mono text-slate-400 border border-slate-200">
                            Host: {ORDER_BASE_URL}
                        </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                        {orderEndpoints.map(ep => (
                            <EndpointCard key={ep.id} endpoint={ep} baseUrl={ORDER_BASE_URL} />
                        ))}
                    </div>
                </div>
            );
        };

        const App = () => {
            const [activeTab, setActiveTab] = useState(2); // Start on Catalog

            return (
                <div className="min-h-screen pb-20">
                    <header className="pt-10 pb-6 text-center">
                        <h1 className="text-4xl font-black text-slate-800 tracking-tight mb-2">
                            <span className="text-blue-500">Cloud</span> Explorer
                        </h1>
                        <p className="text-slate-400 font-bold uppercase tracking-widest text-xs">Static Assignment Dashboard</p>
                    </header>

                    <Navbar activeTab={activeTab} setActiveTab={setActiveTab} />

                    <main className="w-full max-w-[95%] mx-auto px-4">
                        {activeTab === 1 && <UserPage />}
                        {activeTab === 2 && <CatalogPage />}
                        {activeTab === 3 && <OrderPage />}
                        {activeTab === 4 && <EmptyState title="Microservice 4" />}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
